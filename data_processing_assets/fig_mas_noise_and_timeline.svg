<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="370" fill="#ffffff"/>

  <!-- Panel A: MAS noise decay curve -->
  <text x="260" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#14304f">MAS Noise Decay</text>
  <text x="260" y="62" text-anchor="middle" font-size="11.5" fill="#3a5674" font-family="Consolas, 'Cascadia Code', monospace">alpha_t = max(0, 0.01 - t . 2e-6)</text>

  <!-- axes -->
  <line x1="90" y1="100" x2="90" y2="280" stroke="#94a3b8" stroke-width="1"/>
  <line x1="90" y1="280" x2="430" y2="280" stroke="#94a3b8" stroke-width="1"/>

  <!-- y ticks -->
  <line x1="86" y1="280" x2="90" y2="280" stroke="#94a3b8"/>
  <text x="80" y="284" text-anchor="end" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">0</text>
  <line x1="86" y1="198.2" x2="90" y2="198.2" stroke="#94a3b8"/>
  <text x="80" y="202" text-anchor="end" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">0.005</text>
  <line x1="86" y1="116.4" x2="90" y2="116.4" stroke="#94a3b8"/>
  <text x="80" y="120" text-anchor="end" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">0.010</text>

  <!-- x ticks -->
  <line x1="90" y1="280" x2="90" y2="284" stroke="#94a3b8"/>
  <text x="90" y="296" text-anchor="middle" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">0</text>
  <line x1="203.3" y1="280" x2="203.3" y2="284" stroke="#94a3b8"/>
  <text x="203.3" y="296" text-anchor="middle" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">2000</text>
  <line x1="316.7" y1="280" x2="316.7" y2="284" stroke="#94a3b8"/>
  <text x="316.7" y="296" text-anchor="middle" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">4000</text>
  <line x1="430" y1="280" x2="430" y2="284" stroke="#94a3b8"/>
  <text x="430" y="296" text-anchor="middle" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">6000</text>

  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#5b6b7c">global step t</text>
  <text x="48" y="190" text-anchor="middle" font-size="11" fill="#5b6b7c" transform="rotate(-90 48 190)">alpha_t</text>

  <!-- decay curve -->
  <path d="M90,116.4 L373.3,280 L430,280" fill="none" stroke="#0f7a72" stroke-width="2.5"/>
  <circle cx="90" cy="116.4" r="3.5" fill="#0f7a72"/>
  <circle cx="373.3" cy="280" r="3.5" fill="#0f7a72"/>

  <line x1="373.3" y1="100" x2="373.3" y2="280" stroke="#b8860b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="373.3" y="93" text-anchor="middle" font-size="10" fill="#6b5210">step 5,000 (~epoch 13)</text>

  <!-- Panel B: training timeline -->
  <text x="675" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#14304f">Training Timeline</text>
  <text x="675" y="62" text-anchor="middle" font-size="11.5" fill="#3a5674" font-family="Consolas, 'Cascadia Code', monospace">max_epochs = 1100, checkpoint every epoch</text>

  <rect x="490" y="210" width="370" height="30" rx="4" fill="#eef3fb" stroke="#2c5aa0" stroke-width="1.5"/>
  <rect x="490" y="210" width="6" height="30" fill="#0f7a72"/>

  <!-- epoch axis -->
  <line x1="490" y1="248" x2="490" y2="252" stroke="#94a3b8"/>
  <text x="490" y="264" text-anchor="middle" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">0</text>
  <line x1="625" y1="248" x2="625" y2="252" stroke="#94a3b8"/>
  <text x="625" y="264" text-anchor="middle" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">400</text>
  <line x1="759" y1="248" x2="759" y2="252" stroke="#94a3b8"/>
  <text x="759" y="264" text-anchor="middle" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">800</text>

  <!-- MAS sliver leader -->
  <line x1="493" y1="208" x2="500" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="502" y="145" font-size="10" fill="#0f6b62">MAS noise active (epoch 0-13)</text>

  <!-- Piper checkpoint marker -->
  <line x1="750" y1="200" x2="750" y2="250" stroke="#2c5aa0" stroke-width="1.5"/>
  <circle cx="750" cy="225" r="4.5" fill="#2c5aa0"/>
  <rect x="670" y="118" width="160" height="50" rx="5" fill="#ffffff" stroke="#2c5aa0" stroke-width="1.5"/>
  <text x="750" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#14304f">Piper (baseline)</text>
  <text x="750" y="153" text-anchor="middle" font-size="10.5" fill="#3a5674" font-family="Consolas, monospace">epoch 773</text>
  <text x="750" y="166" text-anchor="middle" font-size="9.5" fill="#5b6b7c">best val_loss_mel</text>
  <line x1="750" y1="168" x2="750" y2="200" stroke="#2c5aa0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Banhmi-TTS checkpoint marker -->
  <line x1="853" y1="200" x2="853" y2="250" stroke="#0f7a72" stroke-width="1.5"/>
  <circle cx="853" cy="225" r="4.5" fill="#0f7a72"/>
  <rect x="768" y="270" width="170" height="50" rx="5" fill="#eafaf6" stroke="#0f7a72" stroke-width="1.5"/>
  <text x="853" y="289" text-anchor="middle" font-size="12" font-weight="700" fill="#0b4a44">Banhmi-TTS (full)</text>
  <text x="853" y="305" text-anchor="middle" font-size="10.5" fill="#0f6b62" font-family="Consolas, monospace">epoch 1079</text>
  <text x="853" y="318" text-anchor="middle" font-size="9.5" fill="#3f7a72">best val_loss_mel</text>
  <line x1="853" y1="250" x2="853" y2="270" stroke="#0f7a72" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="860" y1="205" x2="860" y2="245" stroke="#5b6b7c" stroke-width="1"/>
  <text x="858" y="198" text-anchor="end" font-size="10" fill="#5b6b7c" font-family="Consolas, monospace">1100 (max)</text>
</svg>
