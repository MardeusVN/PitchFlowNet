# Baseline VITS config — vanilla Piper without any Piper-Modern additions.
# Train on the same dataset/split/budget as Piper-Modern for a fair comparison.
#
# Differences from piper-modern.yaml:
#   use_snake: false          → LeakyReLU instead of Snake1d in generator
#   use_mrd: false            → MPD only, no MultiResolutionDiscriminator
#   use_dur_disc: false       → no DurationDiscriminator adversarial loss
#   use_transformer_flows: false → original WaveNet-only coupling layers
#   use_f0: false             → no F0 predictor, no f0_cond in decoder
#
# Everything else (data, optimizer, LR schedule, segment size, model dims)
# must match piper-modern.yaml exactly so results are comparable.

accelerator: gpu
devices: "2"
strategy: ddp_find_unused_parameters_true
precision: bf16-mixed
max_epochs: 10000
seed: 1234

# Dataset — same as Piper-Modern run (version_12)
dataset_dir: /home/dev/data_preprocessed

# Model dimensions — identical to Piper-Modern
quality: medium
hidden_channels: 192
inter_channels: 192
filter_channels: 768
n_layers: 6
n_heads: 2
resblock: "2"
resblock_kernel_sizes: [3, 5, 7]
resblock_dilation_sizes: [[1, 2], [2, 6], [3, 12]]
upsample_rates: [8, 8, 4]
upsample_initial_channel: 256
upsample_kernel_sizes: [16, 16, 8]

# Training — identical to Piper-Modern
batch_size: 16
num_workers: 8
learning_rate: 0.0002
betas: [0.8, 0.99]
eps: 1.0e-09
lr_decay: 0.999875
segment_size: 8192
max_phoneme_ids: 400
validation_split: 0.05
num_test_examples: 5
checkpoint_epochs: 1
c_mel: 45
c_kl: 1.0

# Architecture flags — ALL FALSE for vanilla VITS baseline
use_snake: false
use_mrd: false
use_dur_disc: false
use_transformer_flows: false
use_f0: false
